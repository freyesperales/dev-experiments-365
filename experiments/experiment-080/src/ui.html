<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>HARbor — private HAR viewer</title>
<style>
:root{--bg:#0f1419;--panel:#171d25;--line:#2a3340;--tx:#e6edf3;--mut:#8b98a8;--acc:#4cc2ff;--ok:#3fb950;--warn:#d29922;--bad:#f85149;--blk:#6e7681;--dns:#a371f7;--con:#f0883e;--ssl:#db61a2;--snd:#58a6ff;--wait:#3fb950;--rcv:#4cc2ff}
@media(prefers-color-scheme:light){:root{--bg:#f6f8fa;--panel:#fff;--line:#d0d7de;--tx:#1f2328;--mut:#59636e;--acc:#0969da;--ok:#1a7f37;--warn:#9a6700;--bad:#cf222e}}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--tx);font:14px/1.45 system-ui,sans-serif}
header{display:flex;gap:12px;align-items:center;flex-wrap:wrap;padding:10px 16px;border-bottom:1px solid var(--line);background:var(--panel)}
h1{font-size:18px;margin:0}h1 span{color:var(--mut);font-weight:400;font-size:13px}
button,.btn{background:var(--panel);color:var(--tx);border:1px solid var(--line);border-radius:6px;padding:5px 10px;font:inherit;cursor:pointer}button:hover,.btn:hover{border-color:var(--acc)}button.pri{background:var(--acc);color:#fff;border-color:var(--acc)}
input[type=search]{flex:1;min-width:220px;background:var(--bg);color:var(--tx);border:1px solid var(--line);border-radius:6px;padding:6px 10px;font:inherit}
#drop{margin:40px auto;max-width:640px;border:2px dashed var(--line);border-radius:12px;padding:40px;text-align:center}#drop.over{border-color:var(--acc)}
#drop p{color:var(--mut)}.err{color:var(--bad);margin-top:12px;white-space:pre-wrap}
main{display:none}main.on{display:block}
#sum{display:flex;flex-wrap:wrap;gap:8px 20px;padding:10px 16px;border-bottom:1px solid var(--line);color:var(--mut)}#sum b{color:var(--tx)}
#bar{display:flex;gap:8px;padding:8px 16px;align-items:center;flex-wrap:wrap}
.chips button{padding:2px 8px;font-size:12px}
#wrap{display:grid;grid-template-columns:1fr;gap:0}#wrap.det{grid-template-columns:minmax(0,1.3fr) minmax(320px,1fr)}
#tbl{overflow:auto;max-height:calc(100vh - 190px)}table{border-collapse:collapse;width:100%}
th{position:sticky;top:0;background:var(--panel);text-align:left;font-weight:600;padding:4px 8px;border-bottom:1px solid var(--line);cursor:pointer;white-space:nowrap;font-size:12px;color:var(--mut)}
td{padding:3px 8px;border-bottom:1px solid var(--line);white-space:nowrap;font-variant-numeric:tabular-nums}tr.r:hover{background:color-mix(in srgb,var(--acc) 10%,transparent)}tr.sel{background:color-mix(in srgb,var(--acc) 20%,transparent)}
td.u{max-width:340px;overflow:hidden;text-overflow:ellipsis}.s2{color:var(--ok)}.s3{color:var(--warn)}.s4,.s5,.s0{color:var(--bad)}
td.wf{width:34%;min-width:200px;padding:6px 8px}.wfb{position:relative;height:12px;background:color-mix(in srgb,var(--line) 40%,transparent);border-radius:2px}.seg{position:absolute;top:0;height:12px;min-width:1px}
.k-blocked{background:var(--blk)}.k-dns{background:var(--dns)}.k-connect{background:var(--con)}.k-ssl{background:var(--ssl)}.k-send{background:var(--snd)}.k-wait{background:var(--wait)}.k-receive{background:var(--rcv)}
#det{border-left:1px solid var(--line);padding:10px 14px;overflow:auto;max-height:calc(100vh - 190px);display:none}#wrap.det #det{display:block}
#det h3{margin:0 0 6px;font-size:14px;word-break:break-all}.tabs{display:flex;gap:4px;margin:8px 0}.tabs button{padding:2px 10px;font-size:12px}.tabs button.on{background:var(--acc);color:#fff;border-color:var(--acc)}
pre{background:var(--bg);border:1px solid var(--line);border-radius:6px;padding:8px;overflow:auto;white-space:pre-wrap;word-break:break-all;font:12px/1.4 ui-monospace,monospace;margin:6px 0}
dl{display:grid;grid-template-columns:max-content 1fr;gap:2px 12px;margin:6px 0;font-size:12px}dt{color:var(--mut)}dd{margin:0;word-break:break-all}
.card{margin:16px;padding:12px 16px;border:1px solid var(--line);border-radius:8px;background:var(--panel)}.card h2{margin:0 0 8px;font-size:15px}
.bad{color:var(--bad)}.good{color:var(--ok)}.legend{display:flex;gap:10px;font-size:11px;color:var(--mut);flex-wrap:wrap}.legend i{display:inline-block;width:9px;height:9px;margin-right:3px}
#toast{position:fixed;bottom:16px;left:50%;transform:translateX(-50%);background:var(--panel);border:1px solid var(--acc);padding:8px 14px;border-radius:8px;display:none;max-width:90vw}
.mono{font-family:ui-monospace,monospace;font-size:12px}
</style></head>
<body>
<header><h1>HARbor <span>private HAR viewer · nothing leaves this tab</span></h1>
<input type="search" id="q" placeholder='filter: text  status:5xx  method:post  host:api  type:json  slower:500  larger:100k  header:cookie  body:error  -type:image' disabled>
<button id="open">Open .har</button><button id="diffb" disabled>Compare newer HAR…</button><button id="red" disabled class="pri">Redact &amp; save</button><button id="demo">Load demo</button>
<input type="file" id="f1" accept=".har,.json,application/json" hidden><input type="file" id="f2" accept=".har,.json,application/json" hidden></header>
<div id="drop"><h2>Drop a .har file here</h2><p>Chrome/Edge/Firefox DevTools → Network → “Save all as HAR”. It is parsed locally; no upload, no account, works offline.</p><button id="open2" class="pri">Choose file</button> <button id="demo2">Try the demo</button><div class="err" id="err"></div></div>
<main id="main"><div id="sum"></div><div id="bar"><span class="legend" id="legend"></span><span id="count" style="margin-left:auto;color:var(--mut)"></span></div>
<div id="diffview"></div>
<div id="wrap"><div id="tbl"><table><thead><tr><th data-k="index">#</th><th data-k="method">Method</th><th data-k="status">Status</th><th data-k="host">URL</th><th data-k="type">Type</th><th data-k="size">Size</th><th data-k="time">Time</th><th data-k="start">Waterfall</th></tr></thead><tbody id="rows"></tbody></table></div><div id="det"></div></div></main>
<div id="toast"></div>
<script>
/*__CORE__*/
(function(){
const $=s=>document.querySelector(s), H=window.HARbor;
let cur=null,view=[],sel=null,sortK='start',sortD=1,tab='headers';
const esc=s=>String(s==null?'':s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const kb=n=>n>=1048576?(n/1048576).toFixed(1)+' MB':n>=1024?(n/1024).toFixed(1)+' kB':n+' B',ms=n=>n>=1000?(n/1000).toFixed(2)+' s':Math.round(n)+' ms';
function toast(m){const t=$('#toast');t.textContent=m;t.style.display='block';clearTimeout(toast.t);toast.t=setTimeout(()=>t.style.display='none',3500)}
function fail(m){$('#err').textContent=m;$('#drop').style.display='block';$('#main').classList.remove('on')}
function load(text,name){try{cur=H.parseHar(text);cur.name=name||'capture.har'}catch(e){fail(e.message);return}
  $('#err').textContent='';$('#drop').style.display='none';$('#main').classList.add('on');['q','diffb','red'].forEach(i=>$('#'+i).disabled=false);
  $('#diffview').innerHTML='';sel=null;$('#wrap').classList.remove('det');render(true)}
function readFile(f,cb){const r=new FileReader();r.onerror=()=>fail('Could not read file');r.onload=()=>cb(String(r.result),f.name);r.readAsText(f)}
function summary(){const s=H.summarize(cur.entries);const bits=[['requests',s.count],['transferred',kb(s.bytes)],['wall clock',ms(s.wall)],['failed',s.failed?`<span class="bad">${s.failed}</span>`:0],['from cache',s.cached]];
  const pg=cur.meta.pages[0];if(pg&&pg.onLoad>=0)bits.push(['onLoad',ms(pg.onLoad)]);
  let h=bits.map(b=>`<span>${b[0]} <b>${b[1]}</b></span>`).join('')+`<span class="mono">${esc(cur.name)} · ${esc(cur.meta.creator)}</span>`;
  if(s.duplicates.length)h+=`<span class="bad">${s.duplicates.length} URL(s) fetched repeatedly — e.g. ${s.duplicates[0].count}× ${esc(s.duplicates[0].url.slice(0,60))}</span>`;
  $('#sum').innerHTML=h}
function render(reset){
  if(reset)summary();
  const q=$('#q').value;view=H.filter(cur.entries,q).sort((a,b)=>{const x=a[sortK],y=b[sortK];return (x<y?-1:x>y?1:a.index-b.index)*sortD});
  const total=Math.max(1,...cur.entries.map(e=>e.start+e.time));
  $('#legend').innerHTML=H.PHASES.map(p=>`<span><i class="k-${p}"></i>${p}</span>`).join('');
  $('#count').textContent=`${view.length} of ${cur.entries.length}`;
  $('#rows').innerHTML=view.map(e=>{let x=e.start,segs='';H.PHASES.forEach(p=>{const w=e.phases[p];if(w>0){segs+=`<div class="seg k-${p}" style="left:${(x/total*100).toFixed(2)}%;width:${(w/total*100).toFixed(2)}%"></div>`;x+=w}});
    return `<tr class="r${sel===e?' sel':''}" data-i="${e.index}"><td>${e.index+1}</td><td>${e.method}</td><td class="s${Math.floor(e.status/100)}">${e.status||'ERR'}</td><td class="u" title="${esc(e.url)}">${esc(e.host)}${esc(e.path)}<span style="color:var(--mut)">${esc(e.search.slice(0,50))}</span></td><td>${e.type}</td><td>${kb(e.size)}</td><td>${ms(e.time)}</td><td class="wf"><div class="wfb">${segs}</div></td></tr>`}).join('')||'<tr><td colspan="8" style="padding:20px;color:var(--mut)">No requests match this filter.</td></tr>'}
function detail(){const e=sel;if(!e){$('#wrap').classList.remove('det');return}$('#wrap').classList.add('det');
  const hl=l=>l.length?`<dl>${l.map(h=>`<dt>${esc(h.name)}</dt><dd>${esc(h.value)}</dd>`).join('')}</dl>`:'<p style="color:var(--mut)">none</p>';
  const tabs=['headers','timing','request','response','curl'];let body='';
  if(tab==='headers')body=`<dl><dt>URL</dt><dd>${esc(e.url)}</dd><dt>Status</dt><dd>${e.status||'—'} ${esc(e.statusText)} ${esc(e.error)}</dd><dt>Protocol</dt><dd>${esc(e.httpVersion)}</dd><dt>Server IP</dt><dd>${esc(e.serverIP)}</dd>${e.redirect?`<dt>Redirect</dt><dd>${esc(e.redirect)}</dd>`:''}</dl><b>Response headers</b>${hl(e.resHeaders)}<b>Request headers</b>${hl(e.reqHeaders)}`;
  else if(tab==='timing')body=`<dl>${H.PHASES.map(p=>`<dt><i class="k-${p}" style="display:inline-block;width:9px;height:9px"></i> ${p}</dt><dd>${e.phases[p]?ms(e.phases[p]):'—'}</dd>`).join('')}<dt>total</dt><dd><b>${ms(e.time)}</b></dd></dl><p style="color:var(--mut)">${e.phases.wait>=Math.max(300,e.time*.6)?'Mostly waiting on the server (TTFB) — look backend-side.':e.phases.receive>=Math.max(300,e.time*.6)?'Mostly download time — payload size or bandwidth.':e.phases.dns+e.phases.connect+e.phases.ssl>=Math.max(200,e.time*.5)?'Mostly connection setup — new connection, DNS or TLS.':''}</p>`;
  else if(tab==='request')body=e.query.length?`<b>Query</b>${hl(e.query)}`:'',body+=e.reqBody?`<b>Body (${esc(e.reqBody.mime)})</b><pre>${esc(pretty(e.reqBody.text))}</pre>`:'<p style="color:var(--mut)">No request body.</p>';
  else if(tab==='response')body=e.resBody==null?'<p style="color:var(--mut)">Body not stored in this HAR.</p>':typeof e.resBody==='object'?`<p>Binary body (${e.resBody.length} base64 chars) not shown.</p>`:`<pre>${esc(pretty(e.resBody))}</pre>`;
  else body=`<pre>${esc(H.toCurl(e))}</pre><button id="cc">Copy</button>`;
  $('#det').innerHTML=`<h3>${e.method} ${esc(e.path)}</h3><div class="tabs">${tabs.map(t=>`<button data-t="${t}" class="${t===tab?'on':''}">${t}</button>`).join('')}</div>${body}`;
  const cc=$('#cc');if(cc)cc.onclick=()=>copy(H.toCurl(e))}
function pretty(t){try{return JSON.stringify(JSON.parse(t),null,2)}catch(x){return t}}
function copy(t){(navigator.clipboard?navigator.clipboard.writeText(t):Promise.reject()).then(()=>toast('Copied'),()=>{const a=document.createElement('textarea');a.value=t;document.body.appendChild(a);a.select();try{document.execCommand('copy');toast('Copied')}catch(e){toast('Copy failed — select the text manually')}a.remove()})}
function save(name,text){const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([text],{type:'application/json'}));a.download=name;document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(a.href),1000)}
$('#rows').onclick=ev=>{const tr=ev.target.closest('tr.r');if(!tr)return;sel=cur.entries[+tr.dataset.i];tab='headers';render();detail()};
$('#det').onclick=ev=>{const b=ev.target.closest('[data-t]');if(b){tab=b.dataset.t;detail()}};
document.querySelectorAll('th').forEach(th=>th.onclick=()=>{const k=th.dataset.k;sortD=sortK===k?-sortD:1;sortK=k;render()});
$('#q').oninput=()=>render();
['open','open2'].forEach(i=>$('#'+i).onclick=()=>$('#f1').click());
$('#f1').onchange=e=>{if(e.target.files[0])readFile(e.target.files[0],load);e.target.value=''};
document.addEventListener('dragover',e=>{e.preventDefault();$('#drop').classList.add('over')});document.addEventListener('dragleave',()=>$('#drop').classList.remove('over'));
document.addEventListener('drop',e=>{e.preventDefault();$('#drop').classList.remove('over');const f=e.dataTransfer.files[0];if(f)readFile(f,cur&&e.shiftKey?compare:load)});
$('#diffb').onclick=()=>$('#f2').click();$('#f2').onchange=e=>{if(e.target.files[0])readFile(e.target.files[0],compare);e.target.value=''};
function compare(text,name){let other;try{other=H.parseHar(text)}catch(e){toast(name+': '+e.message);return}
  const d=H.diff(cur.entries,other.entries);const w=(c)=>c.why.map(x=>`<span class="${x.bad?'bad':'good'}">${x.kind}: ${['status','type'].includes(x.kind)?esc(x.from)+' → '+esc(x.to):/larger|smaller/.test(x.kind)?kb(x.from)+' → '+kb(x.to):ms(x.from)+' → '+ms(x.to)}</span>`).join(' · ');
  $('#diffview').innerHTML=`<div class="card"><h2>${esc(cur.name)} (baseline) → ${esc(name)} (new) <span class="${d.regressions?'bad':'good'}">· ${d.regressions} regression${d.regressions===1?'':'s'}</span></h2><p style="color:var(--mut)">${d.same.length} unchanged · ${d.changed.length} changed · ${d.added.length} added · ${d.removed.length} removed. Requests are matched by method + URL (cache-busting params ignored).</p>`+
   d.changed.map(c=>`<div class="mono">~ ${c.b.method} ${esc(c.b.host+c.b.path)} — ${w(c)}</div>`).join('')+d.added.map(e=>`<div class="mono ${e.failed?'bad':''}">+ ${e.method} ${esc(e.host+e.path+e.search)} [${e.status||'ERR'}]</div>`).join('')+d.removed.map(e=>`<div class="mono" style="color:var(--mut)">− ${e.method} ${esc(e.host+e.path+e.search)}</div>`).join('')+`<button id="cd" style="margin-top:8px">Close</button></div>`;
  $('#cd').onclick=()=>$('#diffview').innerHTML=''}
$('#red').onclick=()=>{const r=H.redact(cur.har,{});const text=JSON.stringify(r.har,null,1),left=H.scan(text),c=r.counts;
  save(cur.name.replace(/(\.har)?$/i,'.redacted.har'),text);
  toast(`Masked ${c.total} values (${c.headers} headers, ${c.cookies} cookies, ${c.fields} fields, ${c.patterns} token patterns); dropped ${c.bodiesDropped} binary bodies.`+(left.length?' WARNING: leftovers: '+left.map(l=>l.kind).join(', '):' Re-scan clean.'))};
function demo(){fetch('samples/release.har').then(r=>r.text()).then(t=>load(t,'release.har')).catch(()=>load(JSON.stringify(DEMO),'demo.har'))}
const DEMO={log:{version:'1.2',creator:{name:'demo',version:'1'},entries:[
 {startedDateTime:'2026-10-20T09:00:00.000Z',time:300,request:{method:'GET',url:'https://shop.example.com/checkout',httpVersion:'h2',headers:[],queryString:[]},response:{status:200,statusText:'OK',headers:[],content:{size:18400,mimeType:'text/html'},bodySize:18400},timings:{dns:12,connect:40,ssl:30,send:1,wait:200,receive:17}},
 {startedDateTime:'2026-10-20T09:00:00.350Z',time:1900,request:{method:'POST',url:'https://shop.example.com/api/checkout?token=abc',httpVersion:'h2',headers:[{name:'authorization',value:'Bearer secret.token.value1234'}],queryString:[{name:'token',value:'abc'}]},response:{status:500,statusText:'Server Error',headers:[],content:{size:80,mimeType:'application/json',text:'{"error":"upstream timeout"}'},bodySize:80},timings:{send:1,wait:1890,receive:9}}]}};
$('#demo').onclick=$('#demo2').onclick=demo;
if(location.hash==='#demo')demo();
})();
</script></body></html>
