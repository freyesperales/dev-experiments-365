name: Manual release
on:
  workflow_dispatch:
    inputs:
      version:
        description: Version to release
        required: true
permissions:
  contents: read
jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Tag
        env:
          VERSION: ${{ inputs.version }}
          DEPLOY_TOKEN: ${{ secrets.DEPLOY_TOKEN }}
        run: |
          case "$VERSION" in *[!0-9A-Za-z._-]*) echo "bad version"; exit 1;; esac
          git tag "$VERSION"
          ./deploy.sh --token-env DEPLOY_TOKEN
