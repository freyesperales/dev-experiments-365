# Typical small-business box: WordPress + a Node app + a static site, behind Let's Encrypt.
user www-data;
worker_processes auto;
events { worker_connections 1024; }

http {
    include /etc/nginx/mime.types;
    sendfile on;
    server_tokens off;
    gzip on;
    gzip_types text/plain text/css application/json application/javascript;
    client_max_body_size 64m;

    upstream app_backend {
        least_conn;
        server 127.0.0.1:3000;
        server 127.0.0.1:3001 max_fails=3 fail_timeout=30s;
    }

    limit_req_zone $binary_remote_addr zone=login:10m rate=5r/m;

    # --- plain HTTP: redirect everything
    server {
        listen 80;
        listen [::]:80;
        server_name example.com www.example.com app.example.com;
        return 301 https://$host$request_uri;
    }

    # --- www -> apex
    server {
        listen 443 ssl http2;
        server_name www.example.com;
        ssl_certificate /etc/letsencrypt/live/example.com/fullchain.pem;
        ssl_certificate_key /etc/letsencrypt/live/example.com/privkey.pem;
        return 301 https://example.com$request_uri;
    }

    # --- WordPress
    server {
        listen 443 ssl http2;
        server_name example.com;
        ssl_certificate /etc/letsencrypt/live/example.com/fullchain.pem;
        ssl_certificate_key /etc/letsencrypt/live/example.com/privkey.pem;
        ssl_protocols TLSv1.2 TLSv1.3;
        root /var/www/example.com;
        index index.php index.html;
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header Strict-Transport-Security "max-age=31536000" always;
        access_log /var/log/nginx/example.access.log;

        location / {
            try_files $uri $uri/ /index.php?$args;
        }
        location = /robots.txt { access_log off; }
        location ~ \.php$ {
            include snippets/fastcgi-php.conf;
            fastcgi_pass unix:/run/php/php8.2-fpm.sock;
        }
        location ~* \.(jpg|jpeg|png|gif|ico|css|js|woff2)$ {
            expires 30d;
        }
        location ~ /\.ht { deny all; }
        location /wp-admin/ {
            auth_basic "Restricted";
            auth_basic_user_file /etc/nginx/.htpasswd;
            try_files $uri $uri/ /index.php?$args;
        }
        error_page 404 /404.html;
    }

    # --- Node app with websockets
    server {
        listen 443 ssl http2;
        server_name app.example.com;
        ssl_certificate /etc/letsencrypt/live/example.com/fullchain.pem;
        ssl_certificate_key /etc/letsencrypt/live/example.com/privkey.pem;

        location /api/ {
            proxy_pass http://app_backend/v2/;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_read_timeout 90s;
        }
        location /socket.io/ {
            proxy_pass http://app_backend;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";
        }
        location /login {
            limit_req zone=login burst=5;
            proxy_pass http://127.0.0.1:3000;
        }
        location /static/ {
            alias /srv/app/public/;
            expires max;
        }
        location = /healthz { return 200 "ok"; }
        location / {
            proxy_pass http://app_backend;
            proxy_set_header Host $host;
        }
        location /old-blog {
            rewrite ^/old-blog/(.*)$ /blog/$1 permanent;
        }
    }
}
