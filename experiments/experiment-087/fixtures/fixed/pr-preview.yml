name: PR Preview
on:
  pull_request:
    types: [opened, synchronize]
permissions:
  contents: read
jobs:
  preview:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: some-org/deploy-preview@0123456789abcdef0123456789abcdef01234567 # v1.4.0
      - name: Announce
        env:
          TITLE: ${{ github.event.pull_request.title }}
        run: |
          echo "Building PR: $TITLE"
